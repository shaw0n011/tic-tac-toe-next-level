<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe: Next Level</title>
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  --card-bg: rgba(255, 255, 255, 0.07);
  --card-border: rgba(255, 255, 255, 0.18);
  --neon-red: #ff3366;
  --neon-blue: #00d2ff;
  --neon-gold: #ffea00;
  --neon-green: #00ff88;
}

*{box-sizing:border-box}
body{
  margin:0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-gradient);
  color:#fff;min-height:100vh;
  display:flex;justify-content:center;align-items:center;padding:15px;
  overflow-x:hidden;
}

/* 1. Splash Screen & Logo */
#splashScreen {
  position: fixed;top:0;left:0;width:100vw;height:100vh;
  background: #0a0a12;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  z-index: 9999;
  animation: fadeOut 0.8s ease 4.5s forwards;
}
.logo-box {
  position: relative;width: 110px;height: 110px;
  background: linear-gradient(45deg, var(--neon-red), var(--neon-blue));
  border-radius: 24px;display:flex;justify-content:center;align-items:center;
  box-shadow: 0 0 35px rgba(0,210,255,0.6);
  animation: pulseLogo 1.5s infinite alternate, rotateLogo 4s infinite linear;
}
.logo-icon { font-size: 50px; }
.splash-title { margin-top: 25px; font-size: 28px; font-weight: 800; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon-blue); }
.splash-loader { margin-top: 15px; width: 140px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow:hidden; }
.splash-progress { width: 100%; height: 100%; background: var(--neon-green); animation: loadProgress 4.5s linear forwards; }

@keyframes rotateLogo { 0% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.1) rotate(180deg); } 100% { transform: scale(1) rotate(360deg); } }
@keyframes loadProgress { 0% { transform: translateX(-100%); } 100% { transform: translateX(0); } }
@keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

/* Main Game Interface */
#mainGamePage { display: none; width: 100%; max-width: 720px; animation: fadeIn 0.6s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

.card {
  background: var(--card-bg); border-radius: 20px; padding: 22px; margin-bottom: 18px;
  border: 1px solid var(--card-border); backdrop-filter: blur(12px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4); overflow: hidden;
}
h1 { margin: 0; font-size: 24px; text-shadow: 0 0 10px var(--neon-red); }
h2 { margin: 0 0 14px; font-size: 20px; color: var(--neon-blue); }

.controls-group { margin-bottom: 14px; }
.controls-label { font-size: 13px; color: #aaa; margin-bottom: 6px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }

button.opt-btn {
  font-size: 14px; padding: 9px 15px; border-radius: 12px;
  border: 1px solid var(--card-border); background: rgba(0,0,0,0.3);
  color: #fff; cursor: pointer; transition: all 0.25s ease;
}
button.opt-btn:hover { background: rgba(255,255,255,0.15); }
button.opt-btn.active { background: linear-gradient(135deg, var(--neon-red), #ff0055); border: none; font-weight: bold; box-shadow: 0 0 12px var(--neon-red); }

/* Language Selector Dropdown */
.lang-select {
  background: rgba(0, 0, 0, 0.5); color: var(--neon-gold); border: 1px solid var(--neon-blue);
  padding: 6px 12px; border-radius: 10px; font-weight: bold; font-size: 14px; outline: none;
  cursor: pointer;
}

/* Decorative Board Background */
.boardWrap { max-width: 360px; margin: 15px auto; position: relative; width: 100%; }
.board {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  background: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 20px;
  border: 2px solid var(--neon-blue); box-shadow: 0 0 20px rgba(0,210,255,0.2);
}
.cell {
  position: relative; aspect-ratio: 1; border: 2px solid var(--card-border);
  border-radius: 15px; background: rgba(255, 255, 255, 0.04);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: all 0.25s ease; overflow: hidden;
}
.cell:hover { border-color: var(--neon-gold); background: rgba(255,255,255,0.08); transform: scale(1.02); }
.cell:disabled { cursor: default; }

.x { color: var(--neon-red); font-size: 45px; font-weight: 900; text-shadow: 0 0 12px var(--neon-red); }
.o { color: var(--neon-blue); font-size: 45px; font-weight: 900; text-shadow: 0 0 12px var(--neon-blue); }

/* Custom Fixed Double Marks */
.double-x-star { color: var(--neon-red); font-size: 55px; font-weight: 900; line-height: 1; text-shadow: 0 0 15px var(--neon-red); margin-top: 10px; }
.double-o {
  width: 40px; height: 40px; border: 4px solid var(--neon-blue); border-radius: 50%;
  position: relative; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 15px var(--neon-blue);
}
.double-o:after { content: ""; width: 16px; height: 16px; border: 3px solid var(--neon-blue); border-radius: 50%; }
.star-icon { position: absolute; right: 4px; top: 2px; font-size: 14px; color: var(--neon-gold); text-shadow: 0 0 8px var(--neon-gold); }
.shared-text { position: absolute; right: 4px; bottom: 2px; font-size: 10px; color: #bbb; font-weight: bold; }

.winLine {
  position: absolute; height: 6px; background: var(--neon-gold); border-radius: 10px;
  transform-origin: left center; pointer-events: none; z-index: 10;
  box-shadow: 0 0 15px var(--neon-gold);
}
.status { font-size: 18px; font-weight: bold; margin: 12px 0 5px; color: var(--neon-gold); text-align: center; }
.score { font-size: 15px; margin-bottom: 12px; text-align: center; color: #ccc; }
.winText { text-align: center; font-weight: bold; margin-top: 12px; color: var(--neon-green); font-size: 16px; }

/* Rules Cards */
.rule-box {
  background: rgba(0, 0, 0, 0.3); border-left: 4px solid var(--neon-blue);
  border-radius: 12px; padding: 12px 15px; margin: 10px 0; font-size: 14px;
}
.rule-box b { color: var(--neon-gold); display: block; margin-bottom: 4px; }
.rule-box ul { margin: 5px 0; padding-left: 18px; }
.rule-box li { margin-bottom: 4px; }

.footer { text-align: center; color: #888; font-size: 13px; margin-top: 15px; }
</style>
</head>

<body>

<!-- 1. Splash Screen -->
<div id="splashScreen">
  <div class="logo-box"><span class="logo-icon">✕◯</span></div>
  <div class="splash-title">NEXT LEVEL</div>
  <div class="splash-loader"><div class="splash-progress"></div></div>
</div>

<!-- 2. Main Game Interface -->
<div id="mainGamePage">

  <div class="card">
    <h1>✕ Tic-Tac-Toe: Next Level ◯</h1>
    <div style="color:#aaa; font-size:13px; margin-top:3px;">Created by Aftab Shahriar Shawon</div>
  </div>

  <div class="card">
    <h2>🎮 Game Controls</h2>

    <div class="controls-group">
      <div class="controls-label">Opponent:</div>
      <div class="controls">
        <button id="modeBot" class="opt-btn active" onclick="setOpponent('bot')">🤖 vs Computer</button>
        <button id="modeFriend" class="opt-btn" onclick="setOpponent('friend')">👥 vs Friend</button>
      </div>
    </div>

    <div id="botDiffGroup" class="controls-group">
      <div class="controls-label">Bot Level:</div>
      <div class="controls">
        <button id="diff1" class="opt-btn" onclick="setDifficulty(1)">Easy</button>
        <button id="diff2" class="opt-btn" onclick="setDifficulty(2)">Medium</button>
        <button id="diff3" class="opt-btn active" onclick="setDifficulty(3)">Hard</button>
      </div>
    </div>

    <div class="controls-group">
      <div class="controls-label">Start Match:</div>
      <div class="controls">
        <button class="opt-btn" onclick="startGame('X')">Play as X</button>
        <button class="opt-btn" onclick="startGame('O')">Play as O</button>
        <button class="opt-btn" style="border-color:var(--neon-red)" onclick="newGame()">Reset Match</button>
      </div>
    </div>

    <div id="status" class="status">Choose X or O to start</div>
    <div class="score">Score — <span id="p1Name">You</span>: <b id="youScore">0</b> | <span id="p2Name">Computer</span>: <b id="cpuScore">0</b></div>

    <div id="boardWrap" class="boardWrap">
      <div id="board" class="board"></div>
      <div id="line"></div>
    </div>
    <div id="winText" class="winText"></div>
  </div>

  <!-- Multi-Language Rules Card -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h2 id="ruleTitle" style="margin:0;">📜 Game Rules</h2>
      <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
        <option value="bn">🇧🇩 বাংলা</option>
        <option value="en">🇬🇧 English</option>
        <option value="hi">🇮🇳 हिन्दी</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="es">🇪🇸 Español</option>
      </select>
    </div>
    
    <div id="rulesContainer"></div>
  </div>

  <div class="footer">Tic-Tac-Toe: Next Level © 2026 — Aftab Shahriar Shawon</div>
</div>

<script>
// Rules Translation Data
const rulesData = {
  bn: {
    title: "📜 গেমের নিয়মাবলী",
    r1Title: "১. জয়লাভের শর্ত",
    r1Text: "যেকোনো একটি সারিতে (সোজা, খাড়া বা কোনাকুনি) ৩টি ঘর মেলাতে হবে এবং ওই সারির মোট পয়েন্ট কমপক্ষে ৩.০ হতে হবে।",
    r2Title: "২. পয়েন্ট দেওয়ার নিয়ম",
    r2List: [
      "প্রথম চাল (ফাঁকা ঘরে): ১.০ পয়েন্ট",
      "দ্বিতীয় চাল (নিজের ঘরে): ১.৫ পয়েন্ট (ডাবল * মার্ক হবে)",
      "শেয়ার্ড ঘর (প্রতিপক্ষের ঘরে): দুজনই ০.৫ পয়েন্ট করে পাবে (½ + ½)",
      "সীমা: একটি ঘর সর্বোচ্চ ২ বার ব্যবহার করা যাবে।"
    ],
    r3Title: "স্পেশাল আইকন",
    r3List: [
      "Double X: লাল রঙের তারা (*) চিহ্ন হয়ে যাবে।",
      "Double O: জ্বলজ্বলে ডাবল রিং ও স্টার (★) হবে।"
    ]
  },
  en: {
    title: "📜 Game Rules",
    r1Title: "1. Winning Requirement",
    r1Text: "Connect 3 boxes in a row (Horizontal, Vertical, or Diagonal) and score at least 3.0 points on that line.",
    r2Title: "2. Point System",
    r2List: [
      "First Use (Empty Box): 1.0 Point",
      "Second Use (Same Player): 1.5 Points (Creates Double * Mark)",
      "Shared Box (Opponent's Box): Both get 0.5 Point each (½ + ½)",
      "Limit: A box can be used maximum 2 times."
    ],
    r3Title: "Special Icons",
    r3List: [
      "Double X: Converts into a Special Red Star (*).",
      "Double O: Converts into a Glowing Double Ring with Star (★)."
    ]
  },
  hi: {
    title: "📜 खेल के नियम",
    r1Title: "1. जीतने की शर्त",
    r1Text: "एक पंक्ति (क्षैतिज, लंबवत, या विकर्ण) में 3 बॉक्स जोड़ें और उस लाइन पर कम से कम 3.0 अंक प्राप्त करें।",
    r2Title: "2. अंक प्रणाली",
    r2List: [
      "पहला उपयोग (खाली बॉक्स): 1.0 अंक",
      "दूसरा उपयोग (समान खिलाड़ी): 1.5 अंक (डबल * मार्क बनता है)",
      "शेयर किया गया बॉक्स (विरोधी का बॉक्स): दोनों को 0.5 अंक मिलते हैं (½ + ½)",
      "सीमा: एक बॉक्स का अधिकतम 2 बार उपयोग किया जा सकता है।"
    ],
    r3Title: "विशेष प्रतीक",
    r3List: [
      "Double X: एक विशेष लाल स्टार (*) में बदल जाता है।",
      "Double O: स्टार (★) के साथ एक चमकती हुई डबल रिंग में बदल जाता है।"
    ]
  },
  ru: {
    title: "📜 Правила игры",
    r1Title: "1. Условие победы",
    r1Text: "Соедините 3 клетки в ряд (по горизонтали, вертикали или диагонали) и наберите не менее 3.0 очков на этой линии.",
    r2Title: "2. Система очков",
    r2List: [
      "Первое использование (пустая клетка): 1.0 балл",
      "Второе использование (тот же игрок): 1.5 балла (создает знак Двойной *)",
      "Общая клетка (клетка соперника): Оба получают по 0.5 балла (½ + ½)",
      "Лимит: Клетку можно использовать максимум 2 раза."
    ],
    r3Title: "Специальные значки",
    r3List: [
      "Double X: Превращается в специальную красную звезду (*).",
      "Double O: Превращается в светящееся двойное кольцо со звездой (★)."
    ]
  },
  es: {
    title: "📜 Reglas del Juego",
    r1Title: "1. Requisito para Ganar",
    r1Text: "Conecta 3 casillas en línea (Horizontal, Vertical o Diagonal) y consigue al menos 3.0 puntos en esa línea.",
    r2Title: "2. Sistema de Puntos",
    r2List: [
      "Primer uso (Casilla vacía): 1.0 Punto",
      "Segundo uso (Mismo jugador): 1.5 Puntos (Crea la marca Doble *)",
      "Casilla compartida (Casilla del oponente): Ambos obtienen 0.5 Puntos (½ + ½)",
      "Límite: Una casilla se puede usar máximo 2 veces."
    ],
    r3Title: "Iconos Especiales",
    r3List: [
      "Double X: Se convierte en una Estrella Roja Especial (*).",
      "Double O: Se convierte en un Anillo Doble Brillante con Estrella (★)."
    ]
  }
};

function changeLanguage(lang) {
  const d = rulesData[lang] || rulesData['bn'];
  document.getElementById('ruleTitle').textContent = d.title;
  
  let html = `
    <div class="rule-box">
      <b>${d.r1Title}</b>
      <p style="margin:4px 0 0;">${d.r1Text}</p>
    </div>
    <div class="rule-box">
      <b>${d.r2Title}</b>
      <ul>
        ${d.r2List.map(item => `<li>${item}</li>`).join('')}
      </ul>
    </div>
    <div class="rule-box">
      <b>${d.r3Title}</b>
      <ul>
        ${d.r3List.map(item => `<li>${item}</li>`).join('')}
      </ul>
    </div>
  `;
  document.getElementById('rulesContainer').innerHTML = html;
}

// Splash screen timer
setTimeout(() => {
  document.getElementById('splashScreen').style.display = 'none';
  document.getElementById('mainGamePage').style.display = 'block';
  changeLanguage('bn');
  newGame();
}, 5000);

let opponentMode = 'bot', botLevel = 3;
let human = 'X', computer = 'O', turn = 'X', gameOver = true;
let board = Array(9).fill('');
let uses = Array(9).fill(0);
let pts = { X: Array(9).fill(0), O: Array(9).fill(0) };
let round = 0;

const lines = [
 [0,1,2],[3,4,5],[6,7,8],
 [0,3,6],[1,4,7],[2,5,8],
 [0,4,8],[2,4,6]
];

function setOpponent(mode) {
  opponentMode = mode;
  document.getElementById('modeBot').classList.toggle('active', mode==='bot');
  document.getElementById('modeFriend').classList.toggle('active', mode==='friend');
  document.getElementById('botDiffGroup').style.display = mode==='bot' ? 'block' : 'none';
  document.getElementById('p1Name').textContent = mode==='bot' ? 'You' : 'Player X';
  document.getElementById('p2Name').textContent = mode==='bot' ? 'Computer' : 'Player O';
  newGame();
}

function setDifficulty(lvl) {
  botLevel = lvl;
  [1,2,3].forEach(l => document.getElementById('diff'+l).classList.toggle('active', l===lvl));
}

function startGame(sign) {
  human = sign; computer = sign === 'X' ? 'O' : 'X';
  newGame();
}

function newGame() {
  round++;
  board = Array(9).fill('');
  uses = Array(9).fill(0);
  pts = { X: Array(9).fill(0), O: Array(9).fill(0) };
  turn = 'X'; gameOver = false;
  document.getElementById('winText').textContent = '';
  document.getElementById('line').innerHTML = '';
  render();

  if(opponentMode === 'bot' && turn === computer) {
    setStatus('Computer thinking...');
    const r = round;
    setTimeout(() => { if(r === round && !gameOver) computerMove(); }, 400);
  } else {
    setStatus(opponentMode === 'bot' ? 'Your turn (' + human + ').' : 'Turn: Player ' + turn);
  }
}

function setStatus(text) { document.getElementById('status').textContent = text; }
function score(p) { return pts[p].reduce((a,b) => a+b, 0); }

function render() {
  const b = document.getElementById('board');
  b.innerHTML = '';

  for(let i=0; i<9; i++) {
    const c = document.createElement('button');
    c.className = 'cell';
    c.disabled = gameOver || (opponentMode === 'bot' && turn !== human) || uses[i] >= 2;
    c.onclick = () => makeMove(i);

    if(uses[i] === 1) {
      c.innerHTML = board[i] === 'X' ? '<span class="x">X</span>' : '<span class="o">O</span>';
    }

    if(uses[i] === 2) {
      if(board[i] === 'X') {
        c.innerHTML = '<span class="double-x-star">*</span>';
      } else if(board[i] === 'O') {
        c.innerHTML = '<span class="double-o"></span><span class="star-icon">★</span>';
      } else {
        c.innerHTML = '<span class="x" style="font-size:26px;position:absolute;left:8%">X</span><span class="o" style="font-size:26px;position:absolute;right:8%">O</span><span class="shared-text">½+½</span>';
      }
    }
    b.appendChild(c);
  }

  document.getElementById('youScore').textContent = score(human);
  document.getElementById('cpuScore').textContent = score(computer);
}

function place(i, p) {
  if(uses[i] >= 2) return false;
  uses[i]++;
  if(uses[i] === 1) { board[i] = p; pts[p][i] = 1; }
  else {
    if(board[i] === p) { pts[p][i] = 1.5; }
    else { board[i] = 'XO'; pts.X[i] = 0.5; pts.O[i] = 0.5; }
  }
  return true;
}

function hasSign(i, p) { return board[i] === p || board[i] === 'XO'; }

function winningLine(p) {
  for(const line of lines) {
    if(line.every(i => hasSign(i, p))) {
      const total = pts[p][line[0]] + pts[p][line[1]] + pts[p][line[2]];
      if(total >= 3) return { line, total };
    }
  }
  return null;
}

function finish(p, w) {
  gameOver = true;
  const winMsg = opponentMode === 'bot' 
    ? (p === human ? 'You Win! 🏆' : 'Computer Wins! 🤖')
    : ('Player ' + p + ' Wins! 🏆');
  setStatus(winMsg);
  document.getElementById('winText').textContent = 'Winning Line Score: ' + w.total;
  render();
  setTimeout(() => drawLine(w.line), 50);
}

function afterMove(p) {
  const w = winningLine(p);
  if(w) { finish(p, w); return true; }
  if(uses.every(x => x === 2)) {
    gameOver = true; setStatus('Draw — All boxes filled!'); render(); return true;
  }
  return false;
}

function makeMove(i) {
  if(gameOver || uses[i] >= 2) return;
  const p = turn;
  place(i, p);
  if(afterMove(p)) return;

  turn = turn === 'X' ? 'O' : 'X';
  render();

  if(opponentMode === 'bot' && turn === computer) {
    setStatus('Computer thinking...');
    const r = round;
    setTimeout(() => { if(r === round && !gameOver) computerMove(); }, 400);
  } else {
    setStatus(opponentMode === 'bot' ? 'Your turn.' : 'Turn: Player ' + turn);
  }
}

function save() { return { board: board.slice(), uses: uses.slice(), X: pts.X.slice(), O: pts.O.slice() }; }
function load(s) { board = s.board; uses = s.uses; pts = { X: s.X, O: s.O }; }
function testMove(i, p) { const s = save(); place(i, p); const w = winningLine(p); load(s); return w; }

function computerMove() {
  if(gameOver) return;
  const avail = [];
  for(let i=0; i<9; i++) if(uses[i] < 2) avail.push(i);
  if(!avail.length) return;

  let move;
  if(botLevel === 1) {
    move = avail[Math.floor(Math.random() * avail.length)];
  } else if(botLevel === 2) {
    move = avail.find(i => testMove(i, computer)) || avail.find(i => testMove(i, human)) || avail[Math.floor(Math.random() * avail.length)];
  } else {
    move = avail.find(i => testMove(i, computer));
    if(move === undefined) move = avail.find(i => testMove(i, human));
    if(move === undefined && uses[4] < 2) move = 4;
    if(move === undefined) {
      const order = [0,2,6,8,1,3,5,7];
      move = order.find(i => uses[i] < 2);
    }
    if(move === undefined) move = avail[0];
  }

  place(move, computer);
  if(afterMove(computer)) return;
  turn = human; setStatus('Your turn.'); render();
}

function drawLine(indexes) {
  const wrap = document.getElementById('boardWrap');
  const cells = [...document.querySelectorAll('.cell')];
  if(cells.length !== 9) return;
  const a = cells[indexes[0]].getBoundingClientRect();
  const z = cells[indexes[2]].getBoundingClientRect();
  const r = wrap.getBoundingClientRect();
  const x1 = a.left + a.width/2 - r.left, y1 = a.top + a.height/2 - r.top;
  const x2 = z.left + z.width/2 - r.left, y2 = z.top + z.height/2 - r.top;
  const dx = x2 - x1, dy = y2 - y1;
  const length = Math.sqrt(dx*dx + dy*dy);
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;

  const l = document.getElementById('line');
  l.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'winLine';
  el.style.left = x1 + 'px'; el.style.top = (y1 - 3) + 'px';
  el.style.width = length + 'px'; el.style.transform = 'rotate(' + angle + 'deg)';
  l.appendChild(el);
}
</script>
